name: Mermaid

# Renders the showcase mesh as Mermaid; see render.yml. Runs only when something
# the Mermaid output depends on changes.
on:
  push:
    branches: [main]
    paths:
      - "mermaid/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/mermaid.yml"
      - ".github/workflows/render.yml"
  pull_request:
    paths:
      - "mermaid/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/mermaid.yml"
      - ".github/workflows/render.yml"

permissions:
  contents: read

jobs:
  render:
    permissions:
      contents: write
    uses: ./.github/workflows/render.yml
    with:
      format: mermaid
