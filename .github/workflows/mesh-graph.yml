name: Mesh graph

# Renders the showcase mesh (internal/cmd/showcase) after every merge, so a
# change to the exporter shows up as a picture on the run's summary page.
# On a pull request the pictures are only uploaded as an artifact: publishing
# them needs write access, which fork PRs do not get.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: mesh-graph-${{ github.ref }}
  cancel-in-progress: true

env:
  # Images are published here, one folder per commit plus "latest".
  GRAPHS_BRANCH: ci-graphs
  # How many commits keep their images on the branch.
  KEEP: 30

jobs:
  graph:
    name: Render the showcase mesh
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install Graphviz and ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq graphviz imagemagick

      - name: Export the showcase mesh
        run: go run ./internal/cmd/showcase out

      - name: Render images
        working-directory: out
        run: |
          for f in *.dot; do
            dot -Tpng -Gdpi=96 "$f" -o "${f%.dot}.png"
          done
          convert -delay 120 -loop 0 cycle-*.png cycles.gif

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mesh-graph
          path: out

      - name: Publish images
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          site=$(mktemp -d)
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" "$GRAPHS_BRANCH" >/dev/null; then
            git clone -q --depth 1 --branch "$GRAPHS_BRANCH" "$remote" "$site"
          else
            git init -q "$site"
          fi

          cd "$site"
          for dir in "$SHA" latest; do
            rm -rf "$dir" && mkdir "$dir"
            cp "$GITHUB_WORKSPACE"/out/static.png "$GITHUB_WORKSPACE"/out/cycles.gif "$dir"/
          done

          # index.txt lists published commits, newest first; drop the oldest.
          { echo "$SHA"; grep -vx "$SHA" index.txt 2>/dev/null || true; } > index.new
          head -n "$KEEP" index.new > index.txt
          tail -n +"$((KEEP + 1))" index.new | xargs -r rm -rf
          rm index.new

          # One squashed commit, force-pushed: old images leave the history too,
          # so the branch stays small.
          git checkout -q --orphan publish
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Mesh graph for ${SHA}"
          git push -q -f "$remote" "publish:${GRAPHS_BRANCH}"

      - name: Summary
        env:
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          {
            echo "## Showcase mesh"
            echo
            if [ "$EVENT" = push ]; then
              base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GRAPHS_BRANCH}/${SHA}"
              echo "### Structure"
              echo "![Showcase mesh](${base}/static.png)"
              echo
              echo "### Run replay, one frame per cycle"
              echo "![Cycles](${base}/cycles.gif)"
            else
              echo "Pull requests do not publish images. Download the **mesh-graph** artifact of this run to see them."
            fi
            echo
            echo "Cycles rendered: $(ls out/cycle-*.dot | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"
